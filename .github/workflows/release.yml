name: Signed Windows Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Existing release tag, for example v0.12.0-alpha.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Windows signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { throw "WIN_CSC_LINK is required" }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { throw "WIN_CSC_KEY_PASSWORD is required" }
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e ".\backend[dev]"
      - run: python -m playwright install chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and sign NSIS release candidate
        run: pnpm release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Generate SPDX SBOM from packaged application
        uses: anchore/sbom-action@v0
        with:
          path: release/win-unpacked
          format: spdx-json
          output-file: release/job-apply-pro.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify signature and generate release metadata
        shell: pwsh
        run: ./scripts/generate_release_metadata.ps1
      - name: Publish verified prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.version_tag }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:DISPATCH_TAG }
          $expected = "v$((Get-Content VERSION -Raw).Trim())"
          if ($tag -ne $expected) { throw "Release tag $tag does not match VERSION ($expected)" }
          git fetch --tags --force
          git rev-parse --verify "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Release tag $tag does not exist." }
          $assets = @(Get-ChildItem release -File | Where-Object {
            $_.Extension -in @(".exe", ".yml", ".blockmap") -or
            $_.Name -eq "SHA256SUMS.txt" -or
            $_.Name -like "*-dependencies.json" -or
            $_.Name -like "*.spdx.json"
          } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw "Expected release assets are missing." }
          gh release create $tag $assets --verify-tag --prerelease --generate-notes --title "Job Apply Pro $tag"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-windows-release
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS.txt
            release/*-dependencies.json
            release/*.spdx.json
          retention-days: 30
          if-no-files-found: error
