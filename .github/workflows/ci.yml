name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install -e ".\backend[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Validate formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package bundled backend
        run: pnpm package:backend

      - name: Smoke-test bundled backend
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_packaged_backend.ps1

      - name: Package unpacked Windows application
        run: |
          $maximumAttempts = 3
          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
            pnpm --filter @job-apply-pro/desktop package:dir
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            $failureCode = $LASTEXITCODE
            if ($attempt -eq $maximumAttempts) {
              exit $failureCode
            }
            Write-Warning "Electron packaging attempt $attempt failed; retrying the network-dependent step."
            Start-Sleep -Seconds (15 * $attempt)
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload package smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: job-apply-pro-windows-unpacked
          path: release/win-unpacked
          retention-days: 7
          if-no-files-found: error
