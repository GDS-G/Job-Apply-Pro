name: Bug report
description: Report reproducible incorrect behavior without including sensitive applicant data.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Redact credentials, personal information, portal content, and tokens.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build and version
      placeholder: Foundation v0.1.0-alpha.1
    validations:
      required: true
