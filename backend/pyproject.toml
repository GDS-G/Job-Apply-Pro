[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "job-apply-pro-backend"
version = "0.22.0a1"
description = "Local Job Apply Pro API and workflow service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=50,<51",
  "fastapi>=0.139,<0.142",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "playwright>=1.58,<2",
  "pillow>=12.3,<13",
  "pypdf>=6.15,<7",
  "pypdfium2>=5.12,<6",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.22,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "reportlab>=4.4,<6",
  "sqlalchemy>=2.0.40,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "mypy>=1.18,<3",
  "pip-audit>=2.9,<3",
  "pyinstaller>=6.21,<7",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-reportlab>=4.4,<5",
  "types-jsonschema>=4.26,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_apply_pro"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
